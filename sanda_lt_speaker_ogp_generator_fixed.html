<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>三田学園文化祭LT会 登壇者紹介OGPジェネレーター</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{
  --blue:#2f80ed;
  --red:#ff5f50;
  --yellow:#ffcc2f;
  --green:#39b86b;
  --ink:#203040;
  --muted:#7d8da3;
  --paper:#fff;
  --bg:#f4f7fb;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  background:#eef3f8;
  color:var(--ink);
}
.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:360px 1fr;
}
.panel{
  background:#fff;
  border-right:1px solid #dfe7ef;
  padding:22px;
  overflow:auto;
}
.panel h1{font-size:22px;margin:0 0 8px}
.panel p{font-size:13px;line-height:1.7;color:#647487;margin:0 0 18px}
.field{margin-bottom:13px}
.field label{
  display:block;font-size:12px;font-weight:800;color:#526173;margin-bottom:6px
}
.field input,.field textarea{
  width:100%;border:1px solid #d7e0ea;border-radius:10px;padding:10px 12px;
  font:inherit;background:#fff;
}
.field textarea{min-height:74px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{
  border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:800;
  cursor:pointer;background:#203040;color:#fff
}
button.sub{background:#edf3f9;color:#203040}
.stage{padding:28px;overflow:auto}
.note{font-size:12px;color:#6f7f91;margin:0 0 12px}

/* ===== OGP ===== */
#capture{
  width:1200px;height:630px;position:relative;overflow:hidden;background:#fff;
  box-shadow:0 28px 70px rgba(32,48,64,.15)
}
.blob{position:absolute;border-radius:50%}
.blob.b1{width:300px;height:300px;background:var(--blue);left:-125px;top:-150px}
.blob.b2{width:210px;height:210px;background:var(--yellow);right:120px;top:-115px}
.blob.b3{width:260px;height:260px;background:var(--green);right:-130px;bottom:-120px}
.dot{position:absolute;border-radius:50%}
.dot.d1{width:42px;height:42px;background:var(--red);left:120px;top:150px}
.dot.d2{width:32px;height:32px;background:var(--yellow);right:260px;top:250px}
.dot.d3{width:26px;height:26px;background:var(--green);left:40px;top:210px}

.card{
  position:absolute;background:#fff;border-radius:26px;
  box-shadow:0 16px 34px rgba(36,55,75,.12)
}
.icon-card{width:112px;height:112px;display:flex;align-items:center;justify-content:center}
.ic1{left:46px;top:48px;transform:rotate(-7deg)}
.ic2{right:50px;top:66px;transform:rotate(6deg)}
.ic3{left:54px;bottom:58px;transform:rotate(5deg)}
.icon{font-size:56px;line-height:1}

.header{
  position:absolute;left:190px;top:50px;right:190px;text-align:left
}
.event-title{
  font-size:30px;font-weight:900;letter-spacing:.02em
}
.event-title .blue{color:var(--blue)}
.event-title .red{color:var(--red)}
.event-sub{
  display:inline-block;margin-top:10px;padding:8px 16px;border-radius:999px;
  background:#e9f2ff;font-size:17px;font-weight:800
}

.main{
  position:absolute;left:190px;top:150px;width:670px
}
.kicker{
  display:inline-block;
  padding:8px 15px;border-radius:999px;background:#eef8ef;border:2px solid #b8e1bf;
  font-weight:800;font-size:17px;line-height:1.2;color:#203040;
}
.talk-title{
  margin-top:18px;font-size:48px;line-height:1.14;font-weight:950;letter-spacing:-.04em;
  white-space:pre-line
}
.speaker{
  margin-top:28px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap
}
.speaker-name{font-size:48px;font-weight:950;line-height:1}
.speaker-role{font-size:22px;font-weight:700;color:#526173;padding-bottom:4px}

.photo-wrap{
  position:absolute;right:52px;top:180px;width:255px;height:315px;
}
.photo-frame{
  position:absolute;inset:0;border-radius:34px;background:#f3f6f9;
  overflow:hidden;border:2px solid #d9e3ed
}
.photo-image{
  width:100%;height:100%;display:block;
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
}
.photo-label{
  position:absolute;left:-20px;bottom:-22px;background:#fff;border-radius:22px;
  box-shadow:0 12px 30px rgba(32,48,64,.13);padding:14px 18px;
  font-size:15px;font-weight:800
}

.footer{
  position:absolute;left:190px;right:52px;bottom:42px;
  display:flex;align-items:flex-end;justify-content:space-between
}
.footer-copy{
  font-size:16px;color:#66788b;line-height:1.7
}
.footer-copy strong{color:#263646}
.tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tag{
  padding:7px 11px;border-radius:999px;background:#f3f6f9;
  font-size:12px;font-weight:800;color:#536579
}

.spark{
  position:absolute;right:340px;bottom:70px;width:72px;height:72px
}
.spark:before,.spark:after,.spark span:before,.spark span:after{
  content:"";position:absolute;left:50%;top:50%;width:3px;height:72px;background:#263646;
  transform:translate(-50%,-50%)
}
.spark:after{transform:translate(-50%,-50%) rotate(90deg)}
.spark span:before{transform:translate(-50%,-50%) rotate(45deg)}
.spark span:after{transform:translate(-50%,-50%) rotate(-45deg)}

@media(max-width:1100px){
  .app{grid-template-columns:1fr}
  .panel{border-right:0;border-bottom:1px solid #dfe7ef}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>登壇者紹介 OGP</h1>
    <p>「知らない世界の話をしよう」用のオリジナルテンプレです。<br>文字と画像を差し替えて、そのままPNGにできます。</p>

    <div class="field"><label>イベント名</label><input id="eventTitle" value="知らない世界の話をしよう"></div>
    <div class="field"><label>サブタイトル</label><input id="eventSub" value="三田学園文化祭LT会"></div>
    <div class="grid2">
      <div class="field"><label>カテゴリ</label><input id="category" value="登壇者紹介"></div>
      <div class="field"><label>番号</label><input id="index" value="#01"></div>
    </div>
    <div class="field"><label>LTタイトル（改行可）</label><textarea id="talkTitle">高校生が知らない
Webエンジニアの世界</textarea></div>
    <div class="grid2">
      <div class="field"><label>登壇者名</label><input id="speakerName" value="田中 博悠"></div>
      <div class="field"><label>肩書き</label><input id="speakerRole" value="Software Engineer"></div>
    </div>
    <div class="field"><label>写真</label><input id="photoInput" type="file" accept="image/*"></div>
    <div class="field"><label>下部コピー</label><textarea id="footerCopy">話そう。聞こう。まだ見ぬ世界を。</textarea></div>
    <div class="field"><label>タグ（カンマ区切り）</label><input id="tags" value="TECH, WEB, CAREER"></div>

    <div class="buttons">
      <button id="downloadBtn">PNGを書き出す</button>
      <button id="resetBtn" class="sub">リセット</button>
    </div>
  </aside>

  <main class="stage">
    <p class="note">1200 × 630 px プレビュー</p>
    <div id="capture">
      <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
      <div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div>

      <div class="card icon-card ic1"><div class="icon">💡</div></div>
      <div class="card icon-card ic2"><div class="icon">⚛</div></div>
      <div class="card icon-card ic3"><div class="icon">&lt;/&gt;</div></div>

      <div class="header">
        <div class="event-title" id="outEventTitle">
          <span class="blue">知らない</span><span class="red">世界</span>の話をしよう
        </div>
        <div class="event-sub" id="outEventSub">三田学園文化祭LT会</div>
      </div>

      <div class="main">
        <div class="kicker" id="outKicker">登壇者紹介 #01</div>
        <div class="talk-title" id="outTalkTitle">高校生が知らない
Webエンジニアの世界</div>
        <div class="speaker">
          <div class="speaker-name" id="outSpeakerName">田中 博悠</div>
          <div class="speaker-role" id="outSpeakerRole">Software Engineer</div>
        </div>
      </div>

      <div class="photo-wrap">
        <div class="photo-frame">
          <div id="outPhoto" class="photo-image" role="img" aria-label="speaker"></div>
        </div>
        <div class="photo-label">SPEAKER</div>
      </div>

      <div class="spark"><span></span></div>

      <div class="footer">
        <div class="footer-copy">
          <strong id="outFooterCopy">話そう。聞こう。まだ見ぬ世界を。</strong><br>
          11月2日・3日｜三田学園 中学校舎
        </div>
        <div class="tags" id="outTags"></div>
      </div>
    </div>
  </main>
</div>

<script>
const defaults = {
  eventTitle:'知らない世界の話をしよう',
  eventSub:'三田学園文化祭LT会',
  category:'登壇者紹介',
  index:'#01',
  talkTitle:'高校生が知らない\\nWebエンジニアの世界',
  speakerName:'田中 博悠',
  speakerRole:'Software Engineer',
  footerCopy:'話そう。聞こう。まだ見ぬ世界を。',
  tags:'TECH, WEB, CAREER'
};
const defaultPhoto = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 700'%3E%3Crect width='600' height='700' fill='%23edf2f7'/%3E%3Ccircle cx='300' cy='240' r='110' fill='%23c8d4df'/%3E%3Crect x='145' y='385' width='310' height='230' rx='110' fill='%23d2dce5'/%3E%3Ctext x='300' y='655' text-anchor='middle' font-size='30' fill='%23778a9d' font-family='sans-serif'%3ESPEAKER PHOTO%3C/text%3E%3C/svg%3E";

function setPhoto(src){
  document.getElementById('outPhoto').style.backgroundImage=`url("${src}")`;
}

function renderEventTitle(v){
  const out=document.getElementById('outEventTitle');
  if(v.includes('知らない世界')){
    out.innerHTML='<span class="blue">知らない</span><span class="red">世界</span>'+v.replace('知らない世界','');
  } else {
    out.textContent=v;
  }
}
function update(){
  renderEventTitle(document.getElementById('eventTitle').value);
  document.getElementById('outEventSub').textContent=document.getElementById('eventSub').value;
  const category = document.getElementById('category').value.trim();
  const index = document.getElementById('index').value.trim();
  document.getElementById('outKicker').textContent = [category, index].filter(Boolean).join(' ');
  document.getElementById('outTalkTitle').textContent=document.getElementById('talkTitle').value;
  document.getElementById('outSpeakerName').textContent=document.getElementById('speakerName').value;
  document.getElementById('outSpeakerRole').textContent=document.getElementById('speakerRole').value;
  document.getElementById('outFooterCopy').textContent=document.getElementById('footerCopy').value;
  const tags=document.getElementById('tags').value.split(',').map(s=>s.trim()).filter(Boolean);
  document.getElementById('outTags').innerHTML=tags.map(t=>`<span class="tag">${t}</span>`).join('');
}
['eventTitle','eventSub','category','index','talkTitle','speakerName','speakerRole','footerCopy','tags']
.forEach(id=>document.getElementById(id).addEventListener('input',update));

document.getElementById('photoInput').addEventListener('change',e=>{
  const file=e.target.files?.[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>setPhoto(reader.result);
  reader.readAsDataURL(file);
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  Object.entries(defaults).forEach(([id,v])=>document.getElementById(id).value=v);
  document.getElementById('photoInput').value='';
  setPhoto(defaultPhoto);
  update();
});
document.getElementById('downloadBtn').addEventListener('click',async()=>{
  const canvas=await html2canvas(document.getElementById('capture'),{
    scale:2,useCORS:true,backgroundColor:null
  });
  const name=(document.getElementById('speakerName').value||'speaker').replace(/[\\/:*?"<>|\s]+/g,'_');
  const a=document.createElement('a');
  a.download=`${name}_speaker_ogp.png`;
  a.href=canvas.toDataURL('image/png');
  a.click();
});
setPhoto(defaultPhoto);
update();
</script>
</body>
</html>
