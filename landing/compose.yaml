services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      # Never fall back to a checkout-local database in production.
      - ${DATA_DIR:?Set DATA_DIR in .env}:/app/data
    environment:
      PORT: 3000
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/event.db
      UPLOAD_DIR: /app/data/uploads
      OGP_DIR: /app/data/ogp
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - landing

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - landing

networks:
  landing:
