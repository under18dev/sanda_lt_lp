services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    environment:
      PORT: 3000
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/event.db
      UPLOAD_DIR: /app/data/uploads
      OGP_DIR: /app/data/ogp
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
    networks:
      - landing

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}
    depends_on:
      - web
    networks:
      - landing

networks:
  landing:
